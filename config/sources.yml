# Manbalar ro'yxati.
#
# 1-qatlam: qidiruv tizimlari (Google News, Bing News) — butun dunyo OAVsi.
# 2-qatlam: saytlarning RSS lentalari (tizim o'zi topadi).
# 3-qatlam: saytning bosh sahifasi va bo'limlari — RSS bo'lmasa ham yangi
#           maqolalarni topadi va har birining TO'LIQ MATNINI tekshiradi.
#
# Yangi sayt qo'shish: `sites` ro'yxatiga domen yozing. Xohlasangiz
# `pages` bilan qo'shimcha bo'lim sahifalarini (masalan, /ru/news) bering.

search:
  # Google News: q — qidiruv so'rovi, lang — interfeys tili/mintaqa
  google_news:
    - {q: '"statistika qoʻmitasi"', lang: uz}
    - {q: '"statistika qo''mitasi"', lang: uz}
    - {q: '"statistika agentligi"', lang: uz}
    - {q: '"статистика қўмитаси"', lang: uz}
    - {q: '"статистика агентлиги"', lang: uz}
    - {q: 'Нацкомстат', lang: ru}
    - {q: '"комитет по статистике" Узбекистан', lang: ru}
    - {q: '"агентство статистики" Узбекистан', lang: ru}
    - {q: 'Госкомстат Узбекистана', lang: ru}
    - {q: '"statistics committee" Uzbekistan', lang: en}
    - {q: '"statistics agency" Uzbekistan', lang: en}
    - {q: 'Uzstat', lang: en}
    - {q: 'Uzbekistan statistics', lang: en}
    - {q: 'Özbekistan istatistik', lang: tr}
    - {q: 'Özbəkistan statistika', lang: az}
    - {q: 'Өзбекстан статистика', lang: kk}
    - {q: 'Өзбекстан статистика комитети', lang: ky}
    - {q: 'Ӯзбекистон омор', lang: tg}
    - {q: 'Ouzbékistan statistique', lang: fr}
    - {q: 'Usbekistan Statistik', lang: de}
    - {q: 'Uzbekistán estadística', lang: es}
    - {q: 'أوزبكستان الإحصاء', lang: ar}
    - {q: 'ازبکستان آمار', lang: fa}
    - {q: '乌兹别克斯坦 统计', lang: zh}
    - {q: '우즈베키스탄 통계', lang: ko}
    - {q: 'ウズベキスタン 統計', lang: ja}
    # ro'yxatga olishlar
    - {q: '"aholini roʻyxatga olish"', lang: uz}
    - {q: '"aholini ro''yxatga olish"', lang: uz}
    - {q: '"biznesni ro''yxatga olish"', lang: uz}
    - {q: '"аҳолини рўйхатга олиш"', lang: uz}
    - {q: 'перепись населения Узбекистан', lang: ru}
    - {q: 'перепись бизнеса Узбекистан', lang: ru}
    - {q: 'Uzbekistan census', lang: en}
    - {q: 'Özbekistan nüfus sayımı', lang: tr}
  bing_news:
    - {q: 'aholini ro''yxatga olish', mkt: en-US}
    - {q: 'перепись населения Узбекистан', mkt: ru-RU}
    - {q: 'Uzbekistan census', mkt: en-US}
    - {q: '"statistika qo''mitasi"', mkt: en-US}
    - {q: '"statistika agentligi"', mkt: en-US}
    - {q: 'Нацкомстат', mkt: ru-RU}
    - {q: 'комитет по статистике Узбекистан', mkt: ru-RU}
    - {q: 'Uzbekistan statistics committee', mkt: en-US}
    - {q: 'Uzbekistan statistics agency', mkt: en-US}
    - {q: 'Özbekistan istatistik', mkt: tr-TR}
    - {q: 'Ouzbékistan statistique', mkt: fr-FR}
    - {q: 'Usbekistan Statistik', mkt: de-DE}
    - {q: '乌兹别克斯坦 统计', mkt: zh-CN}

