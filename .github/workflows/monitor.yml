name: OAV monitoring

on:
  schedule:
    # Toshkent vaqti = UTC+5. Kunduzi (07:07–22:07) har soatda, kechasi 00:07 va 04:07 da.
    # (Yopiq repo uchun oyiga 2000 bepul daqiqaga moslangan.)
    - cron: '7 2-17 * * *'
    - cron: '7 19,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oav-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Kutubxonalar
        run: pip install -q -r requirements.txt

      - name: Holatni tiklash (tekshirilgan havolalar)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: oav-state-${{ github.run_id }}
          restore-keys: oav-state-

      - name: Monitoring
        id: monitor
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python -m monitor.main

      - name: Holatni saqlash
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: oav-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Topilmalarni repoga yozish
        if: always()
        run: |
          git config user.name "oav-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "O'zgarish yo'q"; exit 0; fi
          git commit -q -m "OAV topilmalar: $(TZ=Asia/Tashkent date '+%d.%m.%Y %H:%M')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1

      - name: Xato haqida Telegram'ga xabar
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=⚠️ OAV monitoring ishlamay qoldi. Tafsilot: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
