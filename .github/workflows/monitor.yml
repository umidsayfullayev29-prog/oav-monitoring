name: OAV monitoring

on:
  schedule:
    # Har 15 daqiqada (repo ochiq — GitHub daqiqalari cheklanmagan).
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: oav-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Kutubxonalar
        run: pip install -q -r requirements.txt

      - name: Holatni tiklash (tekshirilgan havolalar)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: oav-state-${{ github.run_id }}
          restore-keys: oav-state-

      - name: Monitoring
        id: monitor
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ARCHIVE_CHAT: '@statistikaoav'
        run: python -m monitor.main

      - name: Holatni saqlash
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: oav-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Topilmalarni repoga yozish
        if: always()
        run: |
          git config user.name "oav-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "O'zgarish yo'q"; exit 0; fi
          git commit -q -m "OAV topilmalar: $(TZ=Asia/Tashkent date '+%d.%m.%Y %H:%M')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1

      - name: Xato haqida Telegram'ga xabar
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=⚠️ OAV monitoring ishlamay qoldi. Tafsilot: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null

  # Budilnik: GitHub jadvali ishonchsiz, shuning uchun har bir tekshiruv tugagach
  # keyingisini o'zi rejalashtiradi (kunduzi 30 daqiqadan, kechasi 60 daqiqadan keyin).
  keyingisi:
    needs: monitor
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Kutish va keyingi tekshiruvni ishga tushirish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          H=$(TZ=Asia/Tashkent date +%H)
          if [ "$H" -lt 7 ]; then GAP=3600; else GAP=1800; fi
          START=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq '.run_started_at')
          ELAPSED=$(( $(date +%s) - $(date -d "$START" +%s) ))
          WAIT=$(( GAP - ELAPSED - 60 ))
          if [ "$WAIT" -gt 0 ]; then echo "Kutish: $WAIT s"; sleep "$WAIT"; fi
          # navbatda yoki ishlab turgan boshqa tekshiruv bo'lsa — yangisini qo'shmaymiz
          BUSY=$(gh api "repos/${{ github.repository }}/actions/workflows/monitor.yml/runs?per_page=5" \
            --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")] | length')
          if [ "$BUSY" = "0" ]; then
            gh workflow run monitor.yml --ref main -R ${{ github.repository }}
            echo "Keyingi tekshiruv ishga tushirildi"
          else
            echo "Boshqa tekshiruv bor ($BUSY) — yangisi qo'shilmadi"
          fi
