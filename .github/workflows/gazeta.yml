name: Gazeta monitoring

# @gazetalar_sharhi — gazeta sahifalari (rasm/PDF) Gemini orqali o'qiladi. Natija faqat shaxsiy chatga.
# Asosiy OAV monitoringidan butunlay alohida: o'z boti, o'z Gemini kaliti, o'z holati (data/gazeta_state.json).
# Har soatda: o'z budilnigi (pastdagi "keyingisi" — asosiy monitoring budilnigiga ulanmagan) +
# zaxira sifatida GitHub jadvali (bu repoda ishonchsiz).
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: "Sinov: oxirgi N ta postni tekshirib, natijani faqat menga yuborsin (0 = oddiy ish)"
        default: '0'
      since:
        description: "Birinchi ishga tushishda shu sanadan boshlab (YYYY-MM-DD, bo'sh = oxirgi 1 kun)"
        default: ''
      probe:
        description: "AI'siz sinov: 1 = PDF matnidan kalit so'z qidirish (Gemini yo'q, holat o'zgarmaydi)"
        default: '0'
      probe_max_id:
        description: "Sinov: shu post raqamigacha (0 = hammasi)"
        default: '0'

permissions:
  contents: write
  actions: write      # o'z budilnigi keyingi tekshiruvni ishga tushirishi uchun (busiz 403 xato)

concurrency:
  group: gazeta-monitor
  cancel-in-progress: false

jobs:
  gazeta:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-gazeta.txt

      - name: Kutubxonalar
        run: pip install -q -r requirements-gazeta.txt

      - name: Gazetalarni tekshirish
        if: ${{ github.event.inputs.probe != '1' }}
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          # faqat gazetaning o'z boti va Gemini kaliti — asosiy monitoring bilan umumiy emas
          GAZETA_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY_GAZETA }}
          GAZETA_BOT_TOKEN: ${{ secrets.GAZETA_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GAZETA_TEST: ${{ github.event.inputs.test || '0' }}
          GAZETA_SINCE: ${{ github.event.inputs.since || '' }}
          RUN_BUDGET_SEC: '2100'
        run: python -m monitor.gazeta

      - name: AI'siz sinov (PDF matni + kalit so'z)
        if: ${{ github.event.inputs.probe == '1' }}
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GAZETA_BOT_TOKEN: ${{ secrets.GAZETA_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROBE_SINCE: ${{ github.event.inputs.since || '2026-11-25' }}
          PROBE_MAX_ID: ${{ github.event.inputs.probe_max_id || '0' }}
        run: python tools/gazeta_probe.py

      - name: Holatni repoga yozish
        if: always()
        run: |
          git config user.name "oav-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/gazeta_state.json data/gazeta_found.jsonl data/gazeta_probe.md; do [ -e "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "O'zgarish yo'q"; exit 0; fi
          git commit -q -m "Gazeta holati: $(TZ=Asia/Tashkent date '+%d.%m.%Y %H:%M')"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; sleep $((RANDOM % 10 + 3)); done
          exit 1

      - name: Xato haqida xabar
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.GAZETA_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=⚠️ Gazeta monitoringi xato berdi: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null

  # Gazetaning o'z budilnigi: ish boshlanganidan ~1 soat o'tib keyingisini ishga tushiradi.
  # Sinov (test, probe) ishga tushishlarida ishlamaydi.
  keyingisi:
    needs: gazeta
    if: ${{ always() && (github.event_name == 'schedule' || (github.event.inputs.test == '0' && github.event.inputs.probe != '1')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Kutish va keyingi gazeta tekshiruvini ishga tushirish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          R=repos/${{ github.repository }}
          START=$(gh api "$R/actions/runs/${{ github.run_id }}/jobs" --jq '.jobs[] | select(.name=="gazeta") | .started_at')
          ELAPSED=$(( $(date +%s) - $(date -d "$START" +%s) ))
          WAIT=$(( 3600 - ELAPSED - 60 ))
          if [ "$WAIT" -gt 0 ]; then echo "Kutish: $WAIT s"; sleep "$WAIT"; fi
          BUSY=$(gh api "$R/actions/workflows/gazeta.yml/runs?per_page=5" \
            --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")] | length')
          if [ "$BUSY" != "0" ]; then echo "Boshqa gazeta tekshiruvi bor ($BUSY) — yangisi qo'shilmadi"; exit 0; fi
          for i in 1 2 3 4 5 6 7 8; do
            if gh api -X POST "$R/actions/workflows/gazeta.yml/dispatches" -f ref=main; then
              echo "Keyingi gazeta tekshiruvi ishga tushirildi"; exit 0
            fi
            echo "Urinish $i muvaffaqiyatsiz — kutamiz"; sleep $((i * 20))
          done
          exit 1

      - name: Budilnik ishlamasa — xabar
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.GAZETA_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=⛔️ Gazeta zanjiri uzildi: keyingi tekshiruv ishga tushmadi. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
