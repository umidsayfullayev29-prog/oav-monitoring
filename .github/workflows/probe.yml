name: probe
on:
  workflow_dispatch:
    inputs:
      urls:
        description: URLs
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -q -r requirements.txt
      - run: python tools/probe.py ${{ inputs.urls }}
