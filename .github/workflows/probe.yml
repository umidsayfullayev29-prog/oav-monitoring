name: probe
on:
  workflow_dispatch:
    inputs:
      urls:
        description: URLs
        required: true
      script:
        description: script
        required: false
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -q -r requirements.txt
      - run: pip install -q pdfplumber
      - run: python ${{ inputs.script || 'tools/probe.py' }} ${{ inputs.urls }}
