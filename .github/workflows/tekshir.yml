name: Ko'rib chiqish ro'yxatini tekshirish
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check yoki send"
        default: check
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -q -r requirements.txt
      - if: ${{ inputs.mode == 'check' }}
        run: python tools/review_check.py
      - if: ${{ startsWith(inputs.mode, 'peek:') }}
        run: python tools/peek_tg.py "${MODE#peek:}"
        env:
          MODE: ${{ inputs.mode }}
      - if: ${{ startsWith(inputs.mode, 'art:') }}
        run: python tools/peek_art.py "${MODE#art:}"
        env:
          MODE: ${{ inputs.mode }}
      - if: ${{ inputs.mode == 'send' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          ARCHIVE_CHAT: '@statistikaoav'
        run: python tools/send_manual.py
      - run: |
          git config user.name "oav-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/review_check.md data/manual_sent.txt data/peek.md 2>/dev/null || true; git commit -qm "Ko'rib chiqish ro'yxati tekshirildi" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
